[build]
  command = "node src/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Security and cache headers are generated by the build into dist/_headers.
# The bare domain -> www redirect is handled by Netlify: www.piyushmittal.in is set as the primary domain.

# The Work section was removed: tell search engines the pages are gone.
[[redirects]]
  from = "/work/*"
  to = "/404.html"
  status = 404
