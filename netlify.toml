[build]
  command = "node src/build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The bare domain -> www redirect is handled by Netlify: www.piyushmittal.in is set as the primary domain.

# The Work section was removed; send old links and search results to the homepage.
[[redirects]]
  from = "/work/*"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
